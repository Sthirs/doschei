name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start minikube
        uses: medyagh/setup-minikube@e9e035a86bbc3caea26a450bd4dbf9d0c453682e # v0.0.21

      - name: Enable ingress addon
        run: minikube addons enable ingress

      - name: Build images in minikube
        run: |
          minikube image build -f apps/backend/Dockerfile -t doschei/backend:dev .
          minikube image build -f apps/frontend/Dockerfile -t doschei/frontend:dev .

      - name: Deploy with Helm
        run: |
          MINIKUBE_IP=$(minikube ip)
          DEV_HOST="doschei.${MINIKUBE_IP}.nip.io"

          helm upgrade --install doschei ./helm/doschei \
            --namespace doschei \
            --create-namespace \
            --wait \
            --timeout 5m \
            --set devMode.enabled=true \
            --set dex.enabled=true \
            --set ingress.host="$DEV_HOST" \
            --set backend.env.CORS_ORIGIN="http://$DEV_HOST"

      - name: Wait for pods to be ready
        run: |
          kubectl -n doschei wait --for=condition=ready pod --all --timeout=120s

      - name: Wait for ingress controller
        run: |
          kubectl -n ingress-nginx wait --for=condition=ready pod -l app.kubernetes.io/component=controller --timeout=120s

      - name: Run integration tests
        run: |
          MINIKUBE_IP=$(minikube ip)
          DEV_HOST="doschei.${MINIKUBE_IP}.nip.io"

          # Wait for backend to respond
          for i in $(seq 1 30); do
            if curl -sf "http://${DEV_HOST}/api/health" > /dev/null 2>&1; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 5
          done

          npm run test:integration -- "http://${DEV_HOST}"

      - name: Run Playwright tests
        run: |
          MINIKUBE_IP=$(minikube ip)
          DEV_HOST="doschei.${MINIKUBE_IP}.nip.io"
          npm run test:playwright -- "http://${DEV_HOST}"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== Pod status ==="
          kubectl -n doschei get pods
          echo "=== Pod logs (backend) ==="
          kubectl -n doschei logs -l app=doschei-backend --tail=50 || true
          echo "=== Pod logs (frontend) ==="
          kubectl -n doschei logs -l app=doschei-frontend --tail=50 || true
          echo "=== Events ==="
          kubectl -n doschei get events --sort-by=.lastTimestamp | tail -20 || true
