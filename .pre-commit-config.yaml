# NOTE: This file should be named prek.toml but Renovate does not support it yet.
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: check-json
      - id: check-json5
      - id: check-toml
      - id: check-yaml
        exclude: ^helm/doschei/templates/
        args:
          - --allow-multiple-documents
      - id: check-xml
      - id: mixed-line-ending
      - id: check-symlinks
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-executables-have-shebangs

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-ast
      - id: check-shebang-scripts-are-executable
      - id: requirements-txt-fixer

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # frozen: v2.4.3
    hooks:
      - id: codespell
        exclude: package-lock\.json$|apps/frontend/src/i18n/it\.ts$
        args:
          - --ignore-words-list=expres,afterall

  - repo: https://github.com/kjanat/actionlint
    rev: 722799fa4b8cc6734debb97bae24aca9e0dbaf59 # frozen: v1.17
    hooks:
      - id: actionlint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 2eeb5678de71a00c0902cbda7105d328432f72cb # frozen: v0.16.8
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 04970bde2c7315e76a91457d89933b0ffc6ab1f4 # frozen: 0.12.16
    hooks:
      - id: uv-lock

  - repo: https://github.com/ansible/ansible-lint
    rev: 665d9e07a1943254d2910faffc106adaf7ea7294 # frozen: v26.8.0
    hooks:
      - id: ansible-lint

  - repo: https://github.com/hadolint/hadolint
    rev: 2eece55955ced00200be9729e9728cb7dacca505 # frozen: v2.15.1
    hooks:
      - id: hadolint-docker

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: b82a6c8896e491b9cb377a99ff3412131920681b # frozen: v0.23.2
    hooks:
      - id: markdownlint-cli2
        exclude: CHANGELOG\.md$

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 9d26afdddb03ce6accf4f3ebbb31e7f3f63f2384 # frozen: 44.97.5
    hooks:
      - id: renovate-config-validator
        args: [--strict]
