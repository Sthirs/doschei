# Per-response Cache-Control chosen by request path, then emitted once at
# server level. A single server-level add_header avoids the nginx inheritance
# trap where a location-level add_header silently shadows every server-level
# header (flagged by semgrep nginx-add-header-override).
map $request_uri $cache_control {
    default                                      "no-store";
    "/app-version.json"                          "no-store";
    "/sw.js"                                     "no-cache";
    "/manifest.webmanifest"                      "no-cache";
    "/index.html"                                "no-store";
    "~*^/assets/"                                "public, max-age=31536000, immutable";
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # stale HTML shell would reference deleted hashed assets
  add_header Cache-Control $cache_control always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://doschei-backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
