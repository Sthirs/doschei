server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /index.html {
    # stale HTML shell would reference deleted hashed assets
    add_header Cache-Control "no-store";
  }

  location / {
    # stale HTML shell would reference deleted hashed assets
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store";
  }

  location = /sw.js {
    # service worker - always revalidate
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    # web app manifest - always revalidate
    add_header Cache-Control "no-cache";
  }

  location = /app-version.json {
    # app version file - never cache
    add_header Cache-Control "no-store";
  }

  location /assets/ {
    # content-hashed assets - cache forever
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /api/ {
    proxy_pass http://doschei-backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
