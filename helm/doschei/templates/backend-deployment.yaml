apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "doschei.fullname" . }}-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "doschei.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.defaultPodOptions }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: backend-tmp
          emptyDir: {}
      containers:
        #trivy:ignore:KSV-0125
        - name: backend
          image: {{ include "doschei.imageRepository" (dict "root" . "image" .Values.backend.image "component" "backend") }}:{{ include "doschei.imageTag" (dict "root" . "image" .Values.backend.image) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: backend-tmp
              mountPath: /tmp
          ports:
            - containerPort: {{ .Values.backend.service.targetPort }}
          env:
            - name: PORT
              value: {{ include "doschei.backendEnvValue" (dict "root" . "key" "PORT") | quote }}
            - name: NODE_ENV
              value: {{ include "doschei.backendEnvValue" (dict "root" . "key" "NODE_ENV") | quote }}
            - name: DB_SYNC
              value: {{ include "doschei.backendEnvValue" (dict "root" . "key" "DB_SYNC") | quote }}
            - name: SEED_ON_STARTUP
              value: {{ include "doschei.backendEnvValue" (dict "root" . "key" "SEED_ON_STARTUP") | quote }}
            - name: CORS_ORIGIN
              value: {{ include "doschei.backendEnvValue" (dict "root" . "key" "CORS_ORIGIN") | quote }}
            - name: DB_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "doschei.backendDatabaseSecretName" . }}
                  key: {{ include "doschei.backendSecretKey" (dict "root" . "type" "hostname") }}
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "doschei.backendDatabaseSecretName" . }}
                  key: {{ include "doschei.backendSecretKey" (dict "root" . "type" "port") }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "doschei.backendDatabaseSecretName" . }}
                  key: {{ include "doschei.backendSecretKey" (dict "root" . "type" "username") }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "doschei.backendDatabaseSecretName" . }}
                  key: {{ include "doschei.backendSecretKey" (dict "root" . "type" "password") }}
            - name: DB_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "doschei.backendDatabaseSecretName" . }}
                  key: {{ include "doschei.backendSecretKey" (dict "root" . "type" "databaseName") }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "doschei.backendJwtSecretName" . }}
                  key: {{ include "doschei.backendSecretKey" (dict "root" . "type" "jwt") }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.backend.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
