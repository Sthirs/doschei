apiVersion: v1
kind: Secret
metadata:
  name: {{ include "doschei.fullname" . }}-backend
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:%v/%s" (include "doschei.databaseUsername" .) (include "doschei.databasePassword" .) (include "doschei.databaseHostname" .) (include "doschei.databasePort" .) (include "doschei.databaseName" .) | quote }}
  DB_HOSTNAME: {{ include "doschei.databaseHostname" . | quote }}
  DB_PORT: {{ include "doschei.databasePort" . | quote }}
  DB_USERNAME: {{ include "doschei.databaseUsername" . | quote }}
  DB_PASSWORD: {{ include "doschei.databasePassword" . | quote }}
  DB_DATABASE_NAME: {{ include "doschei.databaseName" . | quote }}
  JWT_SECRET: {{ .Values.backend.env.JWT_SECRET | quote }}
