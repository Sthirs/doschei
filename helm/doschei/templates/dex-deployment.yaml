{{- if and .Values.dex.enabled .Values.devMode.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doschei-dex
  labels:
    app.kubernetes.io/component: dex
    app.kubernetes.io/instance: {{ .Values.fullnameOverride }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: dex
      app.kubernetes.io/instance: {{ .Values.fullnameOverride }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: dex
        app.kubernetes.io/instance: {{ .Values.fullnameOverride }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/dex-configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: dex
          image: "{{ .Values.dex.image.repository }}:{{ .Values.dex.image.tag }}"
          imagePullPolicy: {{ .Values.dex.image.pullPolicy }}
          args:
            - /bin/sh
            - -c
            - |
              sed "s|\${DOSCHEI_OAUTH_CLIENT_SECRET}|${DOSCHEI_OAUTH_CLIENT_SECRET}|g" \
                /etc/dex/config.yaml > /tmp/config.yaml
              if [ -f /etc/dex/passwords/passwords.yaml ]; then
                echo "Merging dev static passwords into config..."
                echo "staticPasswords:" >> /tmp/config.yaml
                cat /etc/dex/passwords/passwords.yaml | sed 's/^/  /' >> /tmp/config.yaml
              fi
              exec dex serve /tmp/config.yaml
          ports:
            - containerPort: 5556
          env:
            - name: DOSCHEI_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: doschei-dex-passwords
                  key: client-secret
          volumeMounts:
            - name: config
              mountPath: /etc/dex
            - name: passwords
              mountPath: /etc/dex/passwords
              readOnly: true
            - name: data
              mountPath: /var/dex
      volumes:
        - name: config
          configMap:
            name: doschei-dex
        - name: passwords
          secret:
            secretName: doschei-dex-passwords
            optional: true
        - name: data
          emptyDir: {}
{{- end }}
