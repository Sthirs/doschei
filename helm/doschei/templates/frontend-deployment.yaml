apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "doschei.fullname" . }}-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "doschei.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: frontend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.defaultPodOptions }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if not .Values.devMode.enabled }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      volumes:
        - name: frontend-tmp
          emptyDir: {}
      containers:
        #trivy:ignore:KSV-0125
        - name: frontend
          image: {{ include "doschei.imageRepository" (dict "root" . "image" .Values.frontend.image "component" "frontend") }}:{{ include "doschei.imageTag" (dict "root" . "image" .Values.frontend.image) }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          {{- if not .Values.devMode.enabled }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          {{- end }}
          volumeMounts:
            - name: frontend-tmp
              mountPath: /tmp
          ports:
            - containerPort: {{ .Values.frontend.service.targetPort }}
