namespace: doschei
fullnameOverride: doschei

devMode:
  enabled: false

defaultPodOptions: {}

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/sthirs/doschei/frontend
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

backend:
  replicaCount: 1
  image:
    repository: ghcr.io/sthirs/doschei/backend
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  env:
    PORT: "3000"
    NODE_ENV: production
    DB_SYNC: "false"
    SEED_ON_STARTUP: "false"
    CORS_ORIGIN: https://doschei.example.com
    JWT_SECRET: change-me-dev-secret
  database:
    hostname: ""
    port:
    username: ""
    password: ""
    databaseName: ""

ingress:
  enabled: true
  className: nginx
  host: doschei.example.com
  annotations: {}
  tls:
    enabled: false
    host: ""
    secretName: ""

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  auth:
    username: postgres
    password: postgres
    database: doschei
  persistence:
    enabled: false
