namespace: doschei
fullnameOverride: doschei

devMode:
  enabled: false

defaultPodOptions: {}

imagePullSecrets: []

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/sthirs/doschei/frontend
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

backend:
  replicaCount: 1
  image:
    repository: ghcr.io/sthirs/doschei/backend
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  env:
    PORT: "3000"
    NODE_ENV: production
    DB_SYNC: "false"
    SEED_ON_STARTUP: "false"
    CORS_ORIGIN: https://doschei.example.com
  secrets:
    jwt:
      secretName: doschei-backend-secrets
      key: JWT_SECRET
    database:
      secretName: doschei-backend-database
      keys:
        hostname: DB_HOSTNAME
        port: DB_PORT
        username: DB_USERNAME
        password: DB_PASSWORD
        databaseName: DB_DATABASE_NAME

ingress:
  enabled: true
  className: nginx
  host: doschei.example.com
  annotations: {}
  tls:
    enabled: false
    host: ""
    secretName: ""

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  auth:
    secretName: doschei-postgres-auth
    keys:
      username: POSTGRES_USER
      password: POSTGRES_PASSWORD
      database: POSTGRES_DB
  persistence:
    enabled: false
